name: pos_app
description: Mobile POS App with Barcode Scanner for Myanmar shops
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  mobile_scanner: ^3.5.5
  provider: ^6.1.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  # Receipt Print packages - UPDATED VERSIONS
  esc_pos_bluetooth: ^0.5.0
  esc_pos_utils: ^1.1.0
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  # Sales Report packages
  fl_chart: ^0.65.0
  pdf: ^3.10.4
  printing: ^5.11.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.1  # UPDATED from ^0.13.1

# Dependency overrides to resolve version conflicts
dependency_overrides:
  image: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
